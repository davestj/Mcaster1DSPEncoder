# ============================================================
# Mcaster1 Rock & Roll Yolo! — Format Benchmark Config
# Mcaster1DSPEncoder Linux v1.4.0
# ============================================================
#
# Station:   Mcaster1 Rock & Roll Yolo!
# Codecs:    MP3 · Opus · AAC-LC · HE-AAC v1 · HE-AAC v2 · AAC-ELD · FLAC · Vorbis
# Target:    dnas.mcaster1.com:9443
#
# Slot matrix (12 slots — full codec benchmark):
#   1  MP3     128k  44.1kHz  Stereo   /yolo-mp3-128     (standard reference)
#   2  Opus    128k  48kHz    Stereo   /yolo-opus-128    (HQ Opus)
#   3  AAC-LC  128k  44.1kHz  Stereo   /yolo-aac-lc      (AAC Low Complexity)
#   4  HE-AAC  64k   44.1kHz  Stereo   /yolo-aac-he      (AAC+ SBR)
#   5  HE-AACv2 32k  44.1kHz  Stereo   /yolo-aac-hev2    (AAC++ SBR+PS)
#   6  AAC-ELD 64k   44.1kHz  Stereo   /yolo-aac-eld     (low-latency SBR-ELD)
#   7  FLAC    lossless 44.1kHz Stereo /yolo-flac        (archival)
#   8  MP3     64k   44.1kHz  Stereo   /yolo-mp3-64      (low bandwidth)
#   9  Opus    64k   48kHz    Stereo   /yolo-opus-64     (Opus mid)
#  10  Opus    32k   48kHz    Stereo   /yolo-opus-32     (Opus ultra-low)
#  11  MP3     256k  44.1kHz  Stereo   /yolo-mp3-256     (high-quality MP3)
#  12  Vorbis  128k  44.1kHz  Stereo   /yolo-ogg-128     (Ogg Vorbis reference)
# ============================================================

# ── HTTP Admin server ─────────────────────────────────────────────────────────
http-admin:
  enabled: true
  sockets:
    - bind:  "0.0.0.0"
      port:  8330
      ssl:   false
    - bind:  "0.0.0.0"
      port:  8344
      ssl:   true
      cert:  "/etc/ssl/mcaster1.com/mcaster1.com-fullchain.crt"
      key:   "/etc/ssl/mcaster1.com/mcaster1.key"
  admin-username: "djpulse"
  admin-password: "hackme"
  api-token:      "60d561bb40603e054def56ca4c44812720a6179f6391ee5d2a5b781b50036acf"
  session-timeout: 2592000
  webroot: "/var/www/mcaster1.com/Mcaster1DSPEncoder/src/linux/web_ui"
  log-dir:   "/var/log/mcaster1"
  log-level: 4

# ── MySQL / MariaDB connection ────────────────────────────────────────────────
database:
  host:       "127.0.0.1"
  port:       3306
  user:       "your_db_username_here"
  password:   "your_db_password_here"
  db_encoder: "mcaster1_encoder"
  db_media:   "mcaster1_media"
  db_metrics: "mcaster1_metrics"

# ── DNAS server connection details ────────────────────────────────────────────
dnas:
  host:          "dnas.mcaster1.com"
  port:          9443
  status_url:    "/status.xsl"
  stats_url:     "/admin/mcaster1stats"
  admin_url:     "/admin/stats.xsl"
  songdata_url:  "/admin/songdata"
  username:      "djpulse"
  password:      "your_db_password_here"

# ── Encoder slots ─────────────────────────────────────────────────────────────
encoders:

  # ── Slot 1 — MP3 128k Standard ─────────────────────────────────────────────
  - slot:    1
    name:    "Yolo Rock — MP3 128k"
    enabled: true
    input:
      type:    playlist
      path:    "/var/www/mcaster1.com/audio/playlists/lyndenradio-all.m3u"
      shuffle: true
      repeat:  true
    codec:
      format:      mp3
      bitrate:     128
      sample_rate: 44100
      channels:    2
    dsp:
      eq_enabled:   true
      eq_preset:    "classic_rock"
      agc_enabled:  true
      crossfade:
        enabled:    true
        duration:   3.0
    volume: 0.85
    archive:
      enabled: false
    stream:
      host:     "dnas.mcaster1.com"
      port:     9443
      mount:    "/yolo-mp3-128"
      username: "source"
      password: "your_db_password_here"
      protocol: icecast2
      station_name: "Mcaster1 Yolo Rock — MP3 128k"
      description:  "Classic & modern rock — MP3 128kbps 44.1kHz stereo"
      genre:        "Rock"
      url:          "https://mcaster1.com"
      icy2:
        twitter:   "@Mcaster1Radio"
        email:     "studio@mcaster1.com"
        language:  "en"
        country:   "US"
        is_public: true

